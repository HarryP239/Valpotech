<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado del Diagnóstico - Valpotech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light py-5">

    <div class="container" style="max-width: 800px;">
        <div class="card shadow border-0 p-4 p-md-5 rounded-4 bg-white text-center">
            <h2 class="fw-bold text-success mb-2"><i class="fa-solid fa-circle-check me-2"></i>Resultado del Diagnóstico</h2>
            <h4 class="text-secondary mb-4">{{ diagnostico.pyme.nombre_negocio }}</h4>
            
            <div class="row my-3 g-3">
                <div class="col-md-6">
                    <div class="p-3 bg-light rounded-3 border">
                        <h6 class="text-muted mb-1">Puntaje Total</h6>
                        <h3 class="fw-bold text-primary mb-0">{{ diagnostico.puntaje_total }} pts</h3>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-3 bg-light rounded-3 border">
                        <h6 class="text-muted mb-1">Nivel de Madurez</h6>
                        <h3 class="fw-bold text-warning text-uppercase mb-0">{{ diagnostico.nivel_obtenido }}</h3>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="{% url 'detalle_pyme' diagnostico.pyme.id %}" class="btn btn-outline-primary rounded-pill px-4">Ver Ficha de PyME</a>
                <a href="{% url 'listar_pymes' %}" class="btn btn-secondary rounded-pill px-4">Ir al Directorio</a>
            </div>
        </div>
    </div>

</body>
</html>
