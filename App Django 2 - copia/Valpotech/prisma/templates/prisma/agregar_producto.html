<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Publicar Producto - Valpotech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 p-4">
                    <h3 class="fw-bold text-primary mb-3">
                        <i class="bi bi-box-seam-fill"></i> Publicar Nuevo Producto
                    </h3>
                    <p class="text-muted small">PyMe: <strong>{{ pyme.nombre_negocio }}</strong></p>
                    <hr>

                    <!-- IMPORTANTE: enctype="multipart/form-data" es OBLIGATORIO para subir imágenes -->
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre del producto</label>
                            {{ form.nombre }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Descripción</label>
                            {{ form.descripcion }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Precio ($)</label>
                            {{ form.precio }}
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Foto del producto</label>
                            {{ form.imagen }}
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success fw-bold">
                                <i class="bi bi-cloud-upload-fill"></i> Publicar Producto
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
