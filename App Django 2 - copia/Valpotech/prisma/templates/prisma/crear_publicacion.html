<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Publicar Producto - Valpotech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light py-5">

    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm border-0 p-4 rounded-4 bg-white">
            <h3 class="fw-bold text-dark mb-1"><i class="bi bi-shop-window text-success me-2"></i> Publicar Producto</h3>
            <p class="text-muted small mb-4">PyMe: <strong>{{ pyme.nombre_negocio }}</strong></p>

            <!-- enctype="multipart/form-data" es obligatorio para subir imágenes -->
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="titulo" class="form-label fw-semibold">Nombre del producto</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" maxlength="150" required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label fw-semibold">Precio ($)</label>
                    <input type="number" class="form-control" id="precio" name="precio" min="0" step="1" required>
                </div>

                <div class="mb-3">
                    <label for="imagen" class="form-label fw-semibold">Foto del producto</label>
                    <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'detalle_pyme' pyme.id %}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                    <button type="submit" class="btn btn-success rounded-pill px-4 fw-semibold">
                        <i class="bi bi-cloud-upload-fill me-1"></i> Publicar
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
